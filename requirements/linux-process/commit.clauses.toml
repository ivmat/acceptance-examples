# Linux kernel acceptance of a single change: a declared slice. Row titles paraphrase; no kernel text is copied.
# Source documents are GPL-2.0 kernel files read at the release named in `edition`.
# Each row is dated. A row applies to a change only if the rule was in force at the change date (see README).

[standard]
id = "linux-commit-acceptance"
version = "1.0.0"
provenance = "external"
slice = true
title = "Linux kernel rules for accepting a single change"
edition = "Linux v7.3 process documents: submitting-patches.rst, 5.Posting.rst, stable-kernel-rules.rst, coding-assistants.rst"
numbering = "KCA-<doc>-<section>-<n>"
slice_note = "A selection of the rules a maintainer checks when accepting one change. Rows are mechanical, reading, or not decidable from history. Email-only, tooling and tone rules are not rows."


